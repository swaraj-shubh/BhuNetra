[project]
name = "sih26227"
version = "0.1.0"
description = "Semantic retrieval and multi-temporal change analysis of satellite imagery (SIH finals)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "rasterio",
    "pyproj",
    "pystac",
    "pystac-client",
    "qdrant-client",
    "open-clip-torch",
    "torch",
    "torchvision",  # via open_clip; must come from the same CUDA index as torch (tool.uv.sources)
    "pillow",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "huggingface-hub",
    "shapely>=2.1.2",
    "pydantic>=2",
    "planetary-computer>=1.0.0",
    "pyyaml>=6.0.3",
    "transformers>=5.17.0",
    "psutil>=7.2.2",
    "sqlalchemy>=2.1.1",
    "pg8000>=1.31.5",
    "cryptography>=50.0.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pglast>=8.4",
    "pytest",
    "ruff",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"   # CUDA 12.x wheels run on any NVIDIA driver >= 525 (AWS Deep Learning AMI)
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["configs", "ingest", "features", "index", "governance", "api", "change", "worker", "query"]

[tool.ruff]
line-length = 110
extend-exclude = ["models", "data", "web/vendor", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["rasterio.*", "shapely.*"]  # no stubs shipped; typed code still checks our side (DESIGN.md §4)
ignore_missing_imports = true
