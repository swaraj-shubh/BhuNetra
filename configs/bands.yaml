# Canonical band name -> band file name as staged in data/raw/<source>/<aoi>/<date>/ (DESIGN.md §7).
# Masks: see mask_bands. Scale/offset always come from scene.json (raster:bands), never from here.
sentinel2:
  bands: { blue: B02, green: B03, red: B04, nir: B08, nir_narrow: B8A, swir1: B11, swir2: B12 }
  mask_bands: { scl: SCL, cloud_prob: CLD }
landsat:
  # Landsat 8/9 OLI B5 (0.85-0.88 um) is spectrally the narrow NIR; it also serves as `nir`. # VERIFY
  bands: { blue: B2, green: B3, red: B4, nir: B5, nir_narrow: B5, swir1: B6, swir2: B7 }
  mask_bands: { qa_pixel: QA_PIXEL }
  # QA_PIXEL bits (Landsat C2 L2): 0 fill, 1 dilated cloud, 2 cirrus, 3 cloud, 4 cloud shadow, 5 snow (DESIGN.md §9)
  qa_invalid_bits: [0, 1, 2, 3, 4, 5]
  qa_cloud_bits: [1, 2, 3, 4]
sentinel1:
  bands: { vv: VV, vh: VH }   # int16 dB*100, linear = 10**(v/1000)

# Sentinel-2 SCL classes (DESIGN.md §9)
scl:
  invalid: [0, 1, 3, 8, 9, 10]   # nodata, saturated, cloud shadow, cloud medium/high, cirrus
  cloud: [3, 8, 9, 10]           # dilated by quality.CLOUD_DILATE_PX
  snow: [11]                     # masked only in AOIs with mask_snow: true (configs/aoi/<name>.yaml)

# Local / organiser imagery (scripts/stage_local.py, M3b). Band tokens are only trusted once the sensor family is
# identified: "B2" is blue on Sentinel-2 / Landsat 8-9 but GREEN on Resourcesat LISS. Unknown sensor -> only the
# generic names below (or a --manifest) are accepted.
local_aliases:
  generic:    { blue: [blue], green: [green], red: [red], nir: [nir, nir08], nir_narrow: [nir_narrow, nir08_narrow], swir1: [swir1, swir16], swir2: [swir2, swir22] }
  sentinel2:  { blue: [B02, B2], green: [B03, B3], red: [B04, B4], nir: [B08, B8], nir_narrow: [B8A], swir1: [B11], swir2: [B12] }
  landsat89:  { blue: [SR_B2, B2], green: [SR_B3, B3], red: [SR_B4, B4], nir: [SR_B5, B5], swir1: [SR_B6, B6], swir2: [SR_B7, B7] }
  liss:       { green: [B2, BAND2], red: [B3, BAND3], nir: [B4, BAND4], swir1: [B5, BAND5] }   # Resourcesat LISS-III/IV # VERIFY band numbering
local_sensor_hints:   # case-insensitive substrings of file names / tags -> sensor family
  sentinel2: [S2A, S2B, S2C, SENTINEL2, SENTINEL-2, MSIL2A, MSIL1C]
  landsat89: [LC08, LC09, LANDSAT]
  liss: [LISS, RS2, R2A, RESOURCESAT, L3_, L4_]
