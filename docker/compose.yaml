# SIH26227 stack (DESIGN.md §4, §6). M0: db + qdrant + api. worker, tiles (TiTiler) and web join at M2/M6.
#   make up           # normal (images already built/pulled)
#   make up-offline   # + compose.offline.yaml: app network has NO external route (the proof run)
name: sih26227

services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sih}
      POSTGRES_USER: ${POSTGRES_USER:-sih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in docker/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../index/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ../index/migrations/0002_tile_context.sql:/docker-entrypoint-initdb.d/002_tile_context.sql:ro  # keep in sync with index/migrations
      - ../index/migrations/0003_queries.sql:/docker-entrypoint-initdb.d/003_queries.sql:ro
      - ../index/migrations/0004_tile_landcover.sql:/docker-entrypoint-initdb.d/004_tile_landcover.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sih} -d $${POSTGRES_DB:-sih}"]
      interval: 5s
      retries: 20
    ports: ["127.0.0.1:5432:5432"]   # host-side worker (make ingest); loopback only
    networks: [app]

  qdrant:
    image: qdrant/qdrant:v1.19.1   # matches qdrant-client 1.19.1 in uv.lock
    volumes:
      - qdrantdata:/qdrant/storage
    # vectors are mmap'd: after page-cache eviction (builds, big raster reads) a new query took 0.7-2.8 s vs 20-34 ms
    # warm. Read the storage once at start so the demo never starts cold (2.3 GB, ~20 s, in the background).
    command: ["sh", "-c", "(find /qdrant/storage -type f -exec cat {} + > /dev/null &) ; exec ./entrypoint.sh"]
    ports: ["127.0.0.1:6333:6333"]
    networks: [app]

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sih}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sih}
      QDRANT_URL: http://qdrant:6333
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SIH_ROOT: /app
    volumes:
      - ../data:/app/data            # raw/ is never written by the api (DESIGN.md §2.12)
      - ../models:/app/models:ro
      - ../manifests:/app/manifests:ro
      - ../eval/labels:/app/eval/labels:ro   # M5 sample + pre-labels for /label (human labels go to data/labels)
      - ../eval/reports:/app/eval/reports:ro # latest held-out result for the System tab (/stats evaluation)
    depends_on:
      db: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:   # lets `up --wait` block until uvicorn answers (make offline-check raced it)
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/stats')"]
      interval: 5s
      retries: 30
    ports: ["127.0.0.1:8000:8000"]
    networks: [app]

  worker:   # M9 job queue: incremental ingest; same image as the api, no published ports
    image: sih26227-api
    command: ["python", "-m", "worker.jobs"]
    deploy:   # Prithvi eo_vec for new seasons runs here (M7); needs nvidia-container-toolkit (on the AWS DL AMI)
      resources:
        reservations:
          devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sih}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sih}
      QDRANT_URL: http://qdrant:6333
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SIH_ROOT: /app
    volumes:
      - ../data:/app/data              # the worker stages organiser files into data/raw (staging exception, §2.12)
      - ../models:/app/models:ro
      - ../manifests:/app/manifests
    depends_on:
      db: {condition: service_healthy}
      qdrant: {condition: service_started}
      api: {condition: service_healthy}
    networks: [app]

networks:
  app: {}

volumes:
  pgdata: {}
  qdrantdata: {}
